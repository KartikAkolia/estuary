<svg viewBox="0 0 640 400" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, ui-monospace, monospace">
  <rect width="640" height="400" fill="#2E3440" />
  <text x="320" y="28" fill="#EBCB8B" font-size="15" text-anchor="middle" font-weight="bold">The OSI Model — seven layers, application to physical</text>

  <!-- layer boxes, 7 at top (closest to the user) to 1 at bottom (the wire) -->
  <g font-size="12" fill="#ECEFF4">
    <rect x="120" y="46" width="400" height="38" rx="3" fill="#5E81AC" />
    <text x="140" y="70">7 · Application — what the user's software sees (HTTP, DNS, SMTP)</text>

    <rect x="120" y="88" width="400" height="38" rx="3" fill="#5E81AC" opacity="0.9" />
    <text x="140" y="112">6 · Presentation — formats and encrypts the data</text>

    <rect x="120" y="130" width="400" height="38" rx="3" fill="#5E81AC" opacity="0.8" />
    <text x="140" y="154">5 · Session — opens/keeps/closes the connection</text>

    <rect x="120" y="172" width="400" height="38" rx="3" fill="#81A1C1" />
    <text x="140" y="196">4 · Transport — breaks data into segments, reorders them</text>

    <rect x="120" y="214" width="400" height="38" rx="3" fill="#81A1C1" opacity="0.9" />
    <text x="140" y="238">3 · Network — routes packets between networks (IP)</text>

    <rect x="120" y="256" width="400" height="38" rx="3" fill="#88C0D0" />
    <text x="140" y="280" fill="#2E3440">2 · Data Link — frames data, adds MAC addresses</text>

    <rect x="120" y="298" width="400" height="38" rx="3" fill="#88C0D0" opacity="0.85" />
    <text x="140" y="322" fill="#2E3440">1 · Physical — raw bits over cable, fibre, or radio</text>
  </g>

  <text x="320" y="352" fill="#A3BE8C" font-size="11" text-anchor="middle">Data travels down through the layers to send, and back up through them to receive.</text>
  <text x="320" y="372" fill="#4C566A" font-size="10" text-anchor="middle">Original diagram for Estuary — not copied from any source.</text>
</svg>
