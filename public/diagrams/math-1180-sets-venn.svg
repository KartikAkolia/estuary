<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, ui-monospace, monospace">
  <rect width="560" height="340" fill="#2E3440" />
  <text x="280" y="26" fill="#EBCB8B" font-size="15" text-anchor="middle" font-weight="bold">Sets: union, intersection, and difference</text>

  <circle cx="230" cy="170" r="100" fill="#5E81AC" fill-opacity="0.55" stroke="#81A1C1" stroke-width="2" />
  <circle cx="330" cy="170" r="100" fill="#A3BE8C" fill-opacity="0.55" stroke="#8FBCBB" stroke-width="2" />

  <text x="175" y="120" fill="#ECEFF4" font-size="13" font-weight="bold">A</text>
  <text x="390" y="120" fill="#ECEFF4" font-size="13" font-weight="bold">B</text>
  <text x="280" y="174" fill="#2E3440" font-size="11" text-anchor="middle" font-weight="bold">A ∩ B</text>

  <text x="280" y="300" fill="#D8DEE9" font-size="11" text-anchor="middle">A ∪ B = everything in either circle · A ∩ B = only the overlap · A − B = A's part with no overlap</text>
  <text x="280" y="322" fill="#4C566A" font-size="10" text-anchor="middle">Original diagram for Estuary — not copied from any source.</text>
</svg>
