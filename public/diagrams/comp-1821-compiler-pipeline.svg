<svg viewBox="0 0 720 240" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, ui-monospace, monospace">
  <rect width="720" height="240" fill="#2E3440" />
  <text x="360" y="26" fill="#EBCB8B" font-size="15" text-anchor="middle" font-weight="bold">The compiler pipeline — source text to machine code</text>

  <g font-size="11">
    <rect x="20" y="90" width="110" height="60" rx="4" fill="#5E81AC" />
    <text x="75" y="115" fill="#ECEFF4" text-anchor="middle">Source</text>
    <text x="75" y="130" fill="#ECEFF4" text-anchor="middle">Code</text>

    <rect x="150" y="90" width="110" height="60" rx="4" fill="#81A1C1" />
    <text x="205" y="115" fill="#ECEFF4" text-anchor="middle">Lexer</text>
    <text x="205" y="130" fill="#ECEFF4" text-anchor="middle">(tokens)</text>

    <rect x="280" y="90" width="110" height="60" rx="4" fill="#88C0D0" />
    <text x="335" y="115" fill="#2E3440" text-anchor="middle">Parser</text>
    <text x="335" y="130" fill="#2E3440" text-anchor="middle">(parse tree)</text>

    <rect x="410" y="90" width="130" height="60" rx="4" fill="#8FBCBB" />
    <text x="475" y="115" fill="#2E3440" text-anchor="middle">Semantic</text>
    <text x="475" y="130" fill="#2E3440" text-anchor="middle">Analysis</text>

    <rect x="560" y="90" width="140" height="60" rx="4" fill="#A3BE8C" />
    <text x="630" y="115" fill="#2E3440" text-anchor="middle">Code Gen</text>
    <text x="630" y="130" fill="#2E3440" text-anchor="middle">→ Machine Code</text>
  </g>

  <g stroke="#4C566A" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="130" y1="120" x2="148" y2="120" />
    <line x1="260" y1="120" x2="278" y2="120" />
    <line x1="390" y1="120" x2="408" y2="120" />
    <line x1="540" y1="120" x2="558" y2="120" />
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#4C566A" />
    </marker>
  </defs>

  <text x="360" y="190" fill="#D8DEE9" font-size="11" text-anchor="middle">Lexer + Parser form the "front end" — turning raw text into a structured tree the rest of the compiler can work with.</text>
  <text x="360" y="215" fill="#4C566A" font-size="10" text-anchor="middle">Original diagram for Estuary — not copied from any source.</text>
</svg>
