<svg viewBox="0 0 640 380" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, ui-monospace, monospace">
  <rect width="640" height="380" fill="#2E3440" />
  <text x="320" y="26" fill="#EBCB8B" font-size="15" text-anchor="middle" font-weight="bold">Big-O growth: how run time scales with input size</text>

  <!-- axes -->
  <line x1="70" y1="320" x2="580" y2="320" stroke="#4C566A" stroke-width="2" />
  <line x1="70" y1="320" x2="70" y2="50" stroke="#4C566A" stroke-width="2" />
  <text x="580" y="340" fill="#D8DEE9" font-size="11" text-anchor="end">input size (n) →</text>
  <text x="40" y="55" fill="#D8DEE9" font-size="11" text-anchor="start">time ↑</text>

  <!-- O(1) constant -->
  <path d="M 70 300 L 580 300" stroke="#A3BE8C" stroke-width="2.5" fill="none" />
  <text x="585" y="304" fill="#A3BE8C" font-size="11">O(1)</text>

  <!-- O(log n) -->
  <path d="M 70 300 C 200 260, 350 220, 580 190" stroke="#88C0D0" stroke-width="2.5" fill="none" />
  <text x="585" y="194" fill="#88C0D0" font-size="11">O(log n)</text>

  <!-- O(n) linear -->
  <path d="M 70 300 L 580 90" stroke="#81A1C1" stroke-width="2.5" fill="none" />
  <text x="585" y="94" fill="#81A1C1" font-size="11">O(n)</text>

  <!-- O(n^2) quadratic -->
  <path d="M 70 300 C 250 290, 380 180, 480 60" stroke="#BF616A" stroke-width="2.5" fill="none" />
  <text x="440" y="55" fill="#BF616A" font-size="11">O(n²)</text>

  <text x="320" y="365" fill="#4C566A" font-size="10" text-anchor="middle">Original diagram for Estuary — not copied from any source. Curves are illustrative, not to exact scale.</text>
</svg>
