<svg viewBox="0 0 560 340" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, ui-monospace, monospace">
  <rect width="560" height="340" fill="#2E3440" />
  <text x="280" y="26" fill="#EBCB8B" font-size="15" text-anchor="middle" font-weight="bold">A probability distribution — most outcomes cluster near the average</text>

  <line x1="60" y1="280" x2="520" y2="280" stroke="#4C566A" stroke-width="2" />
  <text x="280" y="305" fill="#D8DEE9" font-size="11" text-anchor="middle">value of the random variable →</text>

