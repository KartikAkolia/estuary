<svg viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, ui-monospace, monospace">
  <rect width="640" height="360" fill="#2E3440" />
  <text x="320" y="26" fill="#EBCB8B" font-size="15" text-anchor="middle" font-weight="bold">Programming Paradigms — how vs. what</text>

  <!-- root -->
  <rect x="230" y="42" width="180" height="36" rx="4" fill="#B48EAD" />
  <text x="320" y="65" fill="#ECEFF4" font-size="12" text-anchor="middle">Programming Paradigms</text>

  <!-- lines to two branches -->
  <line x1="320" y1="78" x2="170" y2="112" stroke="#4C566A" stroke-width="2" />
  <line x1="320" y1="78" x2="470" y2="112" stroke="#4C566A" stroke-width="2" />

  <!-- imperative branch -->
  <rect x="80" y="112" width="180" height="36" rx="4" fill="#5E81AC" />
  <text x="170" y="135" fill="#ECEFF4" font-size="12" text-anchor="middle">Imperative — "how"</text>

  <line x1="170" y1="148" x2="90" y2="182" stroke="#4C566A" stroke-width="2" />
  <line x1="170" y1="148" x2="170" y2="182" stroke="#4C566A" stroke-width="2" />
  <line x1="170" y1="148" x2="250" y2="182" stroke="#4C566A" stroke-width="2" />

  <rect x="20" y="182" width="140" height="34" rx="4" fill="#81A1C1" />
  <text x="90" y="204" fill="#ECEFF4" font-size="11" text-anchor="middle">Procedural</text>

  <rect x="100" y="226" width="140" height="34" rx="4" fill="#81A1C1" />
  <text x="170" y="248" fill="#ECEFF4" font-size="11" text-anchor="middle">Object-Oriented</text>

  <rect x="180" y="182" width="140" height="34" rx="4" fill="#81A1C1" />
  <text x="250" y="204" fill="#ECEFF4" font-size="11" text-anchor="middle">Parallel</text>

  <!-- declarative branch -->
  <rect x="380" y="112" width="180" height="36" rx="4" fill="#A3BE8C" />
  <text x="470" y="135" fill="#2E3440" font-size="12" text-anchor="middle">Declarative — "what"</text>

  <line x1="470" y1="148" x2="400" y2="182" stroke="#4C566A" stroke-width="2" />
  <line x1="470" y1="148" x2="480" y2="182" stroke="#4C566A" stroke-width="2" />
  <line x1="470" y1="148" x2="560" y2="182" stroke="#4C566A" stroke-width="2" />

  <rect x="330" y="182" width="140" height="34" rx="4" fill="#8FBCBB" />
  <text x="400" y="204" fill="#2E3440" font-size="11" text-anchor="middle">Functional</text>

  <rect x="410" y="226" width="140" height="34" rx="4" fill="#8FBCBB" />
  <text x="480" y="248" fill="#2E3440" font-size="11" text-anchor="middle">Logic</text>

  <rect x="490" y="182" width="140" height="34" rx="4" fill="#8FBCBB" />
  <text x="560" y="204" fill="#2E3440" font-size="11" text-anchor="middle">Database</text>

  <text x="320" y="300" fill="#D8DEE9" font-size="11" text-anchor="middle">Most modern languages (Python, Java, JavaScript) mix more than one paradigm.</text>
  <text x="320" y="340" fill="#4C566A" font-size="10" text-anchor="middle">Original diagram for Estuary — not copied from any source.</text>
</svg>
