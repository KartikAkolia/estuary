<svg viewBox="0 0 480 480" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, ui-monospace, monospace">
  <rect width="480" height="480" fill="#2E3440" />
  <text x="240" y="28" fill="#EBCB8B" font-size="15" text-anchor="middle" font-weight="bold">The software development lifecycle</text>

  <circle cx="240" cy="255" r="150" fill="none" stroke="#4C566A" stroke-width="2" stroke-dasharray="4 6" />

  <!-- six phase nodes around the circle -->
  <g font-size="11">
    <circle cx="240" cy="105" r="46" fill="#5E81AC" />
    <text x="240" y="101" fill="#ECEFF4" text-anchor="middle">Require-</text>
    <text x="240" y="115" fill="#ECEFF4" text-anchor="middle">ments</text>

    <circle cx="370" cy="180" r="46" fill="#81A1C1" />
    <text x="370" y="184" fill="#ECEFF4" text-anchor="middle">Design</text>

    <circle cx="370" cy="330" r="46" fill="#88C0D0" />
    <text x="370" y="326" fill="#2E3440" text-anchor="middle">Implement-</text>
    <text x="370" y="340" fill="#2E3440" text-anchor="middle">ation</text>

    <circle cx="240" cy="405" r="46" fill="#8FBCBB" />
    <text x="240" y="409" fill="#2E3440" text-anchor="middle">Testing</text>

    <circle cx="110" cy="330" r="46" fill="#A3BE8C" />
    <text x="110" y="326" fill="#2E3440" text-anchor="middle">Deploy-</text>
    <text x="110" y="340" fill="#2E3440" text-anchor="middle">ment</text>

    <circle cx="110" cy="180" r="46" fill="#EBCB8B" />
    <text x="110" y="176" fill="#2E3440" text-anchor="middle">Mainten-</text>
    <text x="110" y="190" fill="#2E3440" text-anchor="middle">ance</text>
  </g>

  <text x="240" y="455" fill="#D8DEE9" font-size="11" text-anchor="middle">Waterfall runs this once, in order. Agile repeats a small version of this loop every sprint.</text>
  <text x="240" y="470" fill="#4C566A" font-size="10" text-anchor="middle">Original diagram for Estuary — not copied from any source.</text>
</svg>
